<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster</title>
  <style>
      body {
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background: linear-gradient(135deg, #ff9a9e, #fad0c4);
          font-family: Arial, sans-serif;
          text-align: center;
          color: white;
      }

      .container {
          padding: 20px;
          background: rgba(0, 0, 0, 0.3);
          border-radius: 15px;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
          margin-bottom: 10px;
          transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .container:hover {
          background: rgba(0, 0, 0, 0.5);
      }

      h1 {
          font-size: 60px;
          margin: 0;
          text-transform: uppercase;
          letter-spacing: 4px;
      }
      p {
          font-size: 20px;
          margin-top: 10px;
      }

      .fb-login-button {
          margin-top: 40px;
      }

      .fb-button {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 362px; /* Adjust based on your layout */
          height: 40px;
          background-color: #1877f2; /* Facebook Blue */
          color: white;
          font-size: 18px;
          font-weight: bold;
          text-align: center;
          border-radius: 9px;
          border: none;
          cursor: pointer;
          transition: background-color 0.3s ease, transform 0.2s ease;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .fb-button:hover {
          background-color: #166fe5; /* Slightly darker blue */
          transform: scale(1.02);
      }

      .fb-button:active {
          background-color: #0e5db8;
          transform: scale(0.98);
      }

      .i_like {
        margin-top: 200px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      #g_button {
          display: flex;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          width: 362px;
          height: 40px;
          border-radius: 5px;
          background-color: #f9f9f9;
          color: #423f3f;
          font-weight: bold;
          margin-top: 40px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          transition: background-color 0.3s ease, transform 0.2s ease;
      }
      #g_button:hover {
          background-color: #ecd8e3;
          transform: scale(1.02);
          cursor: pointer;
      }

      #g_button:active {
          background-color: #e3b4b2;
          transform: scale(0.98);
      }

      #api_page:hover {
          cursor: pointer;
          color: bisque;
      }

  </style>
</head>
<body>
  <div class="container">
    <h1 id="api_page">Poster</h1>
    <p>Welcome to the Poster landing page</p>
  </div>
  <div class="fb-login-button fb-button"
       data-width="362"
       data-height="50"
       data-size="large"
       data-layout=""
       data-button-type="continue_with"
       data-use-continue-as="true"
       data-scope="email"
       data-onlogin="checkLoginState();"
       data-display="popup"
       id="fb-login-btn">
    login with fb
  </div>

  <div id="g_button" ><span id="g_icon"></span>Login with Google<span id="avatar"></span></div>

  <div id="fb-root"></div>
  <div
    class="fb-like i_like"
    data-share="true"
    data-width="450"
    data-show-faces="true">
  </div>
</body>
</html>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_EN/sdk.js"></script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_EN/sdk.js#xfbml=1&version=v22.0&appId=1833672894076404"></script>
<script>
  document.getElementById('api_page').addEventListener('click', function() {
    window.location.href = "/api";
  });

  document.getElementById("fb-login-btn").addEventListener("click", function () {
    const popup = window.open(
      "https://calm-platypus-prompt.ngrok-free.app/auth/facebook",
      "fbLogin",
      "width=500,height=600"
    );

    const checkPopup = setInterval(() => {
      if (!popup || popup.closed) {
        clearInterval(checkPopup);
        console.log("Popup closed. Checking authentication token...");

        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get("access_token");

        if (accessToken) {
          localStorage.setItem("accessToken", accessToken);
          console.log("Login successful! Token saved.");

          const userId = getUserIdFromToken(accessToken);
          console.log("User ID:", userId);

          window.location.href = "/api";
        } else {
          console.error("Login failed: No access token found.");
        }
      }
    }, 2500);
  });

  function getUserIdFromToken(token) {
    try {
      const payload = JSON.parse(atob(token.split(".")[1])); // Декодую payload
      return payload.userId || payload.sub || null; // Повертаю userId
    } catch (error) {
      console.error("Invalid token:", error);
      return null;
    }
  }

</script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  document.getElementById('g_button').addEventListener('click', function() {
    window.location.href = "https://calm-platypus-prompt.ngrok-free.app/auth/google";
  });

  function getAccessTokenFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('access_token');
  }

  window.addEventListener('load', function() {
    const accessToken = getAccessTokenFromUrl();
    if (accessToken) {
      sessionStorage.setItem('access_token', accessToken);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  });
</script>
