name: Deploy App on push

on:
  push:
    branches:
      - dev

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Cache npm dependencies
        uses: actions/cache@v4.2.0
        with:
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Run lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_HOST: localhost  # Використовується для локального середовища
      DATABASE_PORT: 5432
      DATABASE_NAME: poster
      DATABASE_DIALECT: postgres
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_USER: posterfivedev@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Run build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, build]
    env:
      DATABASE_HOST: database.internal  # Використовується для Fly.io
      DATABASE_PORT: 5432
      DATABASE_NAME: poster
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_USER: posterfivedev@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}  # Токен Fly.io
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Install Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH=$HOME/.fly/bin:$PATH
          flyctl version

      - name: Deploy to Fly.io
        run: |
          flyctl auth token
          flyctl deploy --remote-only