name: Deploy App on push

on:
  push:
    branches:
      - dev

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Cache npm dependencies
        uses: actions/cache@v4.2.0
        with:
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: npm ci

      - name: Verify ESLint installation
        run: npx eslint --version

      - name: Run lint
        run: npx eslint ./src/database --fix
  build:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: poster
      DATABASE_DIALECT: postgres
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_USER: posterfivedev@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: npm ci

      - name: Verify Nest CLI installation
        run: npx nest --version

      - name: Run build
        run: npx nest build

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, build]
    env:
      DATABASE_HOST: database.internal
      DATABASE_PORT: 5432
      DATABASE_NAME: poster
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_USER: posterfivedev@gmail.com
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Install Flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Authenticate Fly.io
        run: |
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl auth login --access-token "$FLY_API_TOKEN"
          env:
            FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: |
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl deploy