name: Deploy App on push

on:
  push:
    branches:
      - dev

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Cache npm dependencies
        uses: actions/cache@v4.2.0
        with:
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Cache npm dependencies
        uses: actions/cache@v4.2.0
        with:
           key: node-modules-${{ hashFiles('**/package-lock.json') }}
           path: ~/.npm

      - name: Install dependencies
        run: npm ci

      - name: Verify ESLint installation
        run: npx eslint --version

      - name: Run lint
        run: npx eslint ./src/database --fix

  build:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Cache npm dependencies
        uses: actions/cache@v4.2.0
        with:
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Nest CLI installation
        run: npx nest --version

      - name: Run build
        run: npx nest build

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2

      - name: Install Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app nest-start