name: Lint App on push
on:
  push:
    branches:
      - dev
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Cache
        uses: actions/cache@v4.2.0
        with:
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Install dependencies
        run: npm ci
      - name: Cache
        uses: actions/cache@v4.2.0
        with:
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm
      - name: Run lint
        run: npm run lint
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Get repository code
        uses: actions/checkout@v4.2.2
      - name: Cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.npm
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Run build
        run: npm run build
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - name: Deploy
        run: echo Deploy running